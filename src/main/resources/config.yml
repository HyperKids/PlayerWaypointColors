# PlayerWaypointColors Configuration
# Plugin version - do not change
config-version: 1.0

# PlaceholderAPI Integration
# If enabled, the plugin will attempt to set a player's waypoint color on join
# based on the output of a PlaceholderAPI placeholder.
# Note: The placeholder must return a valid 6-character or 7-character hex code (e.g., FF0000 or #FF0000). Invalid characters and empty strings will be ignored.
placeholderapi:
  # Set to true to enable this feature.
  auto-apply-on-join: false
  # The PlaceholderAPI placeholder that should return a 6-character hex code.
  # Leave this empty to disable the functionality.
  variable: ""

